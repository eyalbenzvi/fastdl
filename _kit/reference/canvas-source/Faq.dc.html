<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שאלות ותשובות – רישיון עד הבית</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F8}
a{color:#0351E0}a:hover{color:#0241B5}
.fd{font-family:"Heebo","Assistant","Arial Hebrew",Arial,sans-serif;color:#15324A;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.fd *,.fd *::before,.fd *::after{box-sizing:border-box}
.fd h1,.fd h2,.fd h3,.fd p,.fd ul,.fd ol{margin:0}
.fd ul,.fd ol{padding:0;list-style:none}
.fd a{color:#0351E0;text-decoration:underline;text-underline-offset:3px}
.fd :focus-visible{outline:3px solid #FFB020;outline-offset:2px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-family:inherit;font-weight:600;font-size:16px;line-height:1.2;text-decoration:none;cursor:pointer}
.fd a.btn{text-decoration:none}
.btn-s,.fd a.btn-s{background:#fff;color:#0351E0;border:2px solid #0351E0}
.btn-s:hover,.fd a.btn-s:hover{background:#F1F5FE}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(21,50,74,.06),0 4px 16px rgba(21,50,74,.06)}
.inp{display:block;width:100%;height:56px;border:1.5px solid #6E8292;border-radius:12px;padding:0 48px 0 16px;font-family:inherit;font-size:18px;color:#15324A;background:#fff}
.inp:focus{outline:3px solid #FFB020;outline-offset:2px}
.wrap{width:100%;max-width:968px;margin:0 auto;padding:0 24px}
.h1{font-size:38px;font-weight:700;line-height:1.2}
.muted{color:#4F5F6B}.small{font-size:15px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #6E8292;background:#fff;font-family:inherit;font-size:16px;font-weight:600;color:#15324A;cursor:pointer}
.chip[aria-pressed="true"]{background:#15324A;border-color:#15324A;color:#fff}
.acc{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:16px 24px;background:none;border:0;font-family:inherit;font-size:18px;font-weight:600;color:#15324A;text-align:start;cursor:pointer}
.acc:hover{background:#F7F9FB}
.only-t,.only-m{display:none!important}
@media (max-width:1023px){.hide-t{display:none!important}.only-t{display:flex!important}}
@media (max-width:640px){.h1{font-size:28px}.hide-m{display:none!important}.only-m{display:flex!important}.wrap{padding:0 16px}.acc{padding:14px 16px}}
</style>
</helmet>
<div class="fd" dir="rtl" style="min-height: 100vh; background: #F4F6F8; display: flex; flex-direction: column">
<dc-import name="Header" hint-size="100%,124px"></dc-import>
<main id="main" style="flex: 1; padding: 44px 0 72px">
<div class="wrap" style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap"><h1 class="h1">שאלות ותשובות</h1><span style="background: #FFF6E8; color: #8A5A12; font-weight: 700; font-size: 14px; padding: 2px 10px; border-radius: 999px; border: 1px dashed #C98A2E">תשובות בטיוטה – לאישור</span></div>
<div role="search" style="position: relative">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">חיפוש בשאלות</label>
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 16px; right: 16px; color: #4F5F6B"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
<input id="q" class="inp" type="search" placeholder="חפשו שאלה, למשל: צילום" value="{{q}}" onChange="{{onQ}}" aria-describedby="count">
</div>
<div role="group" aria-label="סינון לפי נושא" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{c.p}}" onClick="{{c.go}}">{{c.t}}</button></sc-for>
</div>
<p id="count" class="small muted" aria-live="polite">{{countText}}</p>
<div class="card" style="overflow: hidden">
<sc-for list="{{items}}" as="f" hint-placeholder-count="8">
<div style="border-bottom: 1px solid #D9E4EA">
<button type="button" class="acc" aria-expanded="{{f.exp}}" onClick="{{f.toggle}}"><span>{{f.q}}</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: #0351E0; {{f.r}}"><path d="m6 9 6 6 6-6"/></svg></button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 24px 22px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start"><p>{{f.a}}</p><a class="btn btn-s" href="{{f.href}}">{{f.act}}</a></div></sc-if>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="padding: 24px">לא מצאנו שאלה שמתאימה לחיפוש. נסו מילה אחרת, או פנו אלינו.</p></sc-if>
</div>
<div class="card" style="padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap"><p style="font-weight: 700; font-size: 18px">לא מצאתם תשובה?</p><a class="btn btn-s" href="Contact.dc.html">לצור קשר</a></div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '', cat: 'הכל', open: 0 }; }
  renderVals() {
    const s = this.state;
    const F = [
      ['מסירה ובעיות', 'שילמתי והרישיון לא הגיע – מה הסיבות האפשריות?', 'הסיבות הנפוצות: עדיין לא הצטלמתם (אם נדרש), התשלום בסניף דואר עדיין לא הגיע אלינו, או שהרישיון נשלח בדואר רגיל לתיבה בלי שם מזהה. בדקו את מצב הבקשה כדי לדעת איפה היא נמצאת.', 'לבדיקת מצב', 'Auth.dc.html'],
      ['צילום', 'איך יודעים אם צריך להצטלם?', 'בטופס האגרה וברישיון הזמני יש ריבוע אדום בצד שמאל. אם כתוב שם שצריך להצטלם – גשו לתחנת צילום מורשית. אם כתוב שתמונתכם נמצאת במחשב – אין צורך.', 'לדוגמאות המסמכים', 'Guide.dc.html'],
      ['אגרה ותשלום', 'שילמתי פעמיים בטעות – מה עכשיו?', 'האגרה משולמת למשרד התחבורה, ולכן החזר על תשלום כפול נעשה מולו. פנו למוקד משרד התחבורה ‎*5678.', 'לצור קשר', 'Contact.dc.html'],
      ['הזמנה ומשלוח', 'עברו 48 השעות – אפשר עוד לשנות כתובת או שיטת מסירה?', 'לא. אחרי סגירת חלון הבחירה הרישיון יורד לייצור ונשלח בדואר רגיל, ללא מעקב, לכתובת הרשומה במשרד הפנים.', 'לבדיקת מצב', 'Auth.dc.html'],
      ['הזמנה ומשלוח', 'למה אי אפשר לשנות את הכתובת?', 'לפי הנחיות משרד התחבורה, רק מי שנדרש להצטלם מחדש רשאי לשלוח לכתובת אחרת. אפשר להוסיף מספר כניסה, ״אצל״ ומה כתוב על תיבת הדואר.', 'לשיטות המסירה', 'Delivery.dc.html'],
      ['מסירה ובעיות', 'קיבלתי SMS מכם – איך אדע שזה לא הונאה?', 'האתר שלנו נמצא רק בכתובת fastdl.co.il. לא נבקש מכם פרטי אשראי בהודעת SMS או בטלפון. הודעות ה-SMS שלנו נשלחות מהשולח [שם שולח לאישור].', 'על השירות', 'About.dc.html'],
      ['אגרה ותשלום', 'מה ההבדל בין האגרה לבין התשלום על המשלוח?', 'האגרה משולמת למשרד התחבורה עבור הרישיון עצמו. אצלנו משלמים רק אם בחרתם שיטת מסירה בתשלום, למשל משלוח מהיר.', 'למחירון', 'Delivery.dc.html'],
      ['הזמנה ומשלוח', 'כמה זמן נשמר הרישיון בעמדת האיסוף?', '[לאישור] – הנוסח הסופי ייקבע לפי הסיכום עם עמדות האיסוף.', 'לעמדות האיסוף', 'Pickup.dc.html']
    ];
    const q = s.q.trim();
    const list = F.map((f, i) => ({ f, i })).filter(({ f }) => (s.cat === 'הכל' || f[0] === s.cat) && (!q || (f[1] + ' ' + f[2]).indexOf(q) >= 0));
    return {
      q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      cats: ['הכל', 'אגרה ותשלום', 'צילום', 'הזמנה ומשלוח', 'מסירה ובעיות'].map((t) => ({ t, p: s.cat === t ? 'true' : 'false', go: () => this.setState({ cat: t }) })),
      items: list.map(({ f, i }) => ({ q: f[1], a: f[2], act: f[3], href: f[4], open: s.open === i, exp: s.open === i ? 'true' : 'false', r: s.open === i ? 'transform: rotate(180deg)' : '', toggle: () => this.setState({ open: s.open === i ? -1 : i }) })),
      empty: list.length === 0, countText: list.length + ' שאלות מוצגות'
    };
  }
}
</script>
</body>
</html>
