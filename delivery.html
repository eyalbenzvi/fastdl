    <div data-slot="footer"></div>

  <aside class="drawer" id="dl-drawer" role="dialog" aria-modal="true" aria-labelledby="dl-drawer-t" hidden>

      <button type="button" class="icon-btn" aria-label="סגירה" data-close-dialog><svg class="ico" data-icon="x" aria-hidden="true"></svg></button>
