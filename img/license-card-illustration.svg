    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#15324A" flood-opacity=".18"/></filter>
  </defs>
  <circle cx="240" cy="180" r="170" fill="#DCEEF6"/>
