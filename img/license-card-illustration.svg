    <rect x="313" y="124" width="92" height="116" rx="10" fill="#C5DAE5"/>
    <circle cx="359" cy="168" r="20" fill="#9DB7C6"/><path d="M323 240c4-26 18-40 36-40s32 14 36 40z" fill="#9DB7C6"/>
    <g fill="#B6CCD8"><rect x="117" y="132" width="176" height="10" rx="5" fill="#9DB7C6"/><rect x="157" y="155" width="136" height="10" rx="5"/><rect x="135" y="178" width="158" height="10" rx="5"/><rect x="187" y="201" width="106" height="10" rx="5"/><rect x="148" y="224" width="145" height="10" rx="5"/></g>
  </g>
  <rect x="40" y="40" width="72" height="30" rx="15" fill="#15324A"/><text x="76" y="61" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-weight="700" font-size="15" fill="#fff">דוגמה</text>
