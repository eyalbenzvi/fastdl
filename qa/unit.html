<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>בדיקות יחידה – רישיון עד הבית</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .u{padding-block:48px 80px}
    .u__inner{display:flex;flex-direction:column;gap:var(--sp-6)}
    .u-list{display:flex;flex-direction:column}
    .u-list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--c-border)}
    .u-list li:last-child{border-bottom:0}
    .u-list code{direction:ltr;unicode-bidi:isolate;font-size:15px}
    .u-pass{color:var(--c-success);font-weight:var(--fw-bold);flex:none;width:56px}
    .u-fail{color:var(--c-danger);font-weight:var(--fw-bold);flex:none;width:56px}
    .u__inner>.badge{align-self:flex-start}
    .u-group{font-weight:var(--fw-bold);margin-top:var(--sp-4)}
  </style>
  <script defer src="../js/mock-data.js"></script>
  <script defer src="../js/validation.js"></script>
  <script defer src="../js/dates.js"></script>
</head>
<body>
  <main class="u">
    <div class="wrap wrap--form u__inner">
      <h1 class="h1 h1--flow">בדיקות יחידה · <span class="num" dir="ltr">09 §9.6</span></h1>
      <p id="summary" class="badge badge--neutral" role="status" aria-live="polite" data-fails="" data-passes="">מריצים…</p>
      <div class="card card--pad"><ul class="u-list" id="results"></ul></div>
    </div>
  </main>
  <script>
  /* DOMContentLoaded רץ אחרי כל סקריפטי ה-defer שבראש העמוד */
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var list = document.getElementById('results');
    var pass = 0, fail = 0;

    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function group(title) {
      var li = document.createElement('li'); li.className = 'u-group'; li.textContent = title; list.appendChild(li);
    }
    function eq(label, fn, expected) {
      var got, ok;
      try { got = fn(); ok = got === expected; } catch (e) { got = 'throws: ' + e.message; ok = false; }
      if (ok) pass++; else fail++;
      var li = document.createElement('li');
      li.setAttribute('data-result', ok ? 'pass' : 'fail');
      li.innerHTML = '<span class="' + (ok ? 'u-pass">PASS' : 'u-fail">FAIL') + '</span><span><code>' + esc(label) + ' === ' + esc(JSON.stringify(expected)) + '</code>' +
        (ok ? '' : '<br><span class="small">התקבל: <code>' + esc(JSON.stringify(got)) + '</code></span>') + '</span>';
      list.appendChild(li);
    }

    /* ---------- Validate ---------- */
    group('Validate');
    eq("Validate.israeliId('000000018')", function () { return Validate.israeliId('000000018'); }, true);
    eq("Validate.israeliId('18')", function () { return Validate.israeliId('18'); }, true);
    eq("Validate.israeliId('123456789')", function () { return Validate.israeliId('123456789'); }, false);
    eq("Validate.israeliId('')", function () { return Validate.israeliId(''); }, false);
    eq("Validate.israeliId('0') – כולו אפסים", function () { return Validate.israeliId('0'); }, false);
    eq("Validate.israeliId('000000000')", function () { return Validate.israeliId('000000000'); }, false);
    eq("Validate.israeliId('٠٠٠٠٠٠٠١٨') – ספרות ערביות", function () { return Validate.israeliId('٠٠٠٠٠٠٠١٨'); }, true);
    eq("Validate.mobile('054-1234567')", function () { return Validate.mobile('054-1234567'); }, true);
    eq("Validate.mobile('0541234')", function () { return Validate.mobile('0541234'); }, false);
    eq("Validate.mobile('0641234567')", function () { return Validate.mobile('0641234567'); }, false);
    eq("Validate.maskMobile('0541234567')", function () { return Validate.maskMobile('0541234567'); }, '054-•••-4567');
    group('Validate – נרמול קלט (P1-1, P2-1)');
    eq("Validate.normalizeMobile('052-123-4567')", function () { return Validate.normalizeMobile('052-123-4567'); }, '0521234567');
    eq("Validate.normalizeMobile('052 123 4567')", function () { return Validate.normalizeMobile('052 123 4567'); }, '0521234567');
    eq("Validate.normalizeMobile('+972521234567')", function () { return Validate.normalizeMobile('+972521234567'); }, '0521234567');
    eq("Validate.normalizeMobile('+972 52-123-4567')", function () { return Validate.normalizeMobile('+972 52-123-4567'); }, '0521234567');
    eq("Validate.normalizeMobile('972521234567')", function () { return Validate.normalizeMobile('972521234567'); }, '0521234567');
    eq("Validate.normalizeMobile('00972521234567')", function () { return Validate.normalizeMobile('00972521234567'); }, '0521234567');
    eq("Validate.normalizeMobile('+972-0-52-123-4567')", function () { return Validate.normalizeMobile('+972-0-52-123-4567'); }, '0521234567');
    eq("Validate.normalizeMobile('+972')", function () { return Validate.normalizeMobile('+972'); }, '+972');
    eq("Validate.normalizeMobile('9725212')", function () { return Validate.normalizeMobile('9725212'); }, '9725212');
    eq("Validate.normalizeMobile('05212345678')", function () { return Validate.normalizeMobile('05212345678'); }, '0521234567');
    eq("Validate.normalizeMobile('(052) 123-4567')", function () { return Validate.normalizeMobile('(052) 123-4567'); }, '0521234567');
    eq("Validate.normalizeMobile('')", function () { return Validate.normalizeMobile(''); }, '');
    eq("Validate.mobile(Validate.normalizeMobile('+972 52-123-4567'))", function () { return Validate.mobile(Validate.normalizeMobile('+972 52-123-4567')); }, true);
    eq("Validate.normalizeId('123 456 782')", function () { return Validate.normalizeId('123 456 782'); }, '123456782');
    eq("Validate.normalizeId('12345678-2')", function () { return Validate.normalizeId('12345678-2'); }, '123456782');
    eq("Validate.normalizeId(' 123456782')", function () { return Validate.normalizeId(' 123456782'); }, '123456782');
    eq("Validate.normalizeId('1234567890')", function () { return Validate.normalizeId('1234567890'); }, '123456789');
    eq("Validate.normalizeId('12.345.678-2')", function () { return Validate.normalizeId('12.345.678-2'); }, '123456782');
    eq("Validate.israeliId(Validate.normalizeId('12345678-2'))", function () { return Validate.israeliId(Validate.normalizeId('12345678-2')); }, true);
    eq("bindNormalize: הקלדת '052-123-4567' בשדה", function () {
      var i = document.createElement('input'); document.body.appendChild(i); Validate.bindNormalize(i, 'mobile');
      i.value = '052-123-4567'; i.dispatchEvent(new Event('input')); var v = i.value; i.remove(); return v; }, '0521234567');
    eq("bindNormalize: הדבקה של 11 ספרות לא נחתכת (P3-6)", function () {
      var i = document.createElement('input'); document.body.appendChild(i); Validate.bindNormalize(i, 'mobile');
      i.value = '05412345678'; i.dispatchEvent(new InputEvent('input', { inputType: 'insertFromPaste' })); var v = i.value; i.remove(); return v; }, '05412345678');
    eq("bindNormalize: הקלדה בספרות ערביות '٠٥٤١٢٣٤٥٦٧'", function () {
      var i = document.createElement('input'); document.body.appendChild(i); Validate.bindNormalize(i, 'mobile');
      i.value = '٠٥٤١٢٣٤٥٦٧'; i.dispatchEvent(new Event('input')); var v = i.value; i.remove(); return v; }, '0541234567');

    group('Validate – ספרות ערביות/פרסיות (QA_INPUTS P1-2)');
    eq("Validate.toLatinDigits('٠١٢٣٤٥٦٧٨٩')", function () { return Validate.toLatinDigits('٠١٢٣٤٥٦٧٨٩'); }, '0123456789');
    eq("Validate.toLatinDigits('۰۱۲۳۴۵۶۷۸۹')", function () { return Validate.toLatinDigits('۰۱۲۳۴۵۶۷۸۹'); }, '0123456789');
    eq("Validate.toLatinDigits('FD-٢٠٢٦ abc')", function () { return Validate.toLatinDigits('FD-٢٠٢٦ abc'); }, 'FD-2026 abc');
    eq("Validate.digits('٠٥٤-١٢٣٤٥٦٧')", function () { return Validate.digits('٠٥٤-١٢٣٤٥٦٧'); }, '0541234567');
    eq("Validate.normalizeMobile('٠٥٤١٢٣٤٥٦٧')", function () { return Validate.normalizeMobile('٠٥٤١٢٣٤٥٦٧'); }, '0541234567');
    eq("Validate.normalizeId('۱۲۳۴۵۶۷۸۲')", function () { return Validate.normalizeId('۱۲۳۴۵۶۷۸۲'); }, '123456782');
    eq("Validate.mobile('٠٥٤١٢٣٤٥٦٧')", function () { return Validate.mobile('٠٥٤١٢٣٤٥٦٧'); }, true);

    group('Validate – הקלדת קידומת והדבקה (P3-6, P3-7)');
    eq("Validate.normalizeMobile('+')", function () { return Validate.normalizeMobile('+'); }, '+');
    eq("Validate.normalizeMobile('+97')", function () { return Validate.normalizeMobile('+97'); }, '+97');
    eq("Validate.normalizeMobile('0097')", function () { return Validate.normalizeMobile('0097'); }, '0097');
    eq("Validate.normalizeMobile('0097254')", function () { return Validate.normalizeMobile('0097254'); }, '0097254');
    eq("Validate.normalizeMobile('05412345678', true) – הדבקה", function () { return Validate.normalizeMobile('05412345678', true); }, '05412345678');
    eq("Validate.mobile(Validate.normalizeMobile('05412345678', true))", function () { return Validate.mobile(Validate.normalizeMobile('05412345678', true)); }, false);
    eq("Validate.normalizeId('0123456789', true) – הדבקה", function () { return Validate.normalizeId('0123456789', true); }, '0123456789');

    group('Validate – כרטיס אשראי (P2-3, P2-4, P2-5, P3-4, P3-5)');
    eq("Validate.luhn('4580 4580 4580 4580')", function () { return Validate.luhn('4580 4580 4580 4580'); }, true);
    eq("Validate.luhn('4111111111111111')", function () { return Validate.luhn('4111111111111111'); }, true);
    eq("Validate.luhn('4580123456789012')", function () { return Validate.luhn('4580123456789012'); }, false);
    eq("Validate.luhn('000000000000')", function () { return Validate.luhn('000000000000'); }, false);
    eq("Validate.luhn('378282246310005') – Amex", function () { return Validate.luhn('378282246310005'); }, true);
    eq("Validate.normalizeExpiry('12/2028')", function () { return Validate.normalizeExpiry('12/2028'); }, '12/28');
    eq("Validate.normalizeExpiry('1228')", function () { return Validate.normalizeExpiry('1228'); }, '12/28');
    eq("Validate.normalizeExpiry('1/28')", function () { return Validate.normalizeExpiry('1/28'); }, '01/28');
    eq("Validate.normalizeExpiry('12 / 28')", function () { return Validate.normalizeExpiry('12 / 28'); }, '12/28');
    eq("Validate.normalizeExpiry('122028')", function () { return Validate.normalizeExpiry('122028'); }, '12/28');
    eq("Validate.normalizeExpiry('528')", function () { return Validate.normalizeExpiry('528'); }, '05/28');
    eq("Validate.normalizeExpiry('١٢/٢٨')", function () { return Validate.normalizeExpiry('١٢/٢٨'); }, '12/28');
    eq("Validate.cardExpiry('12/28').ok", function () { return Validate.cardExpiry('12/28').ok; }, true);
    eq("Validate.cardExpiry('08/26').ok – החודש של 'עכשיו' (25.8.2026)", function () { return Validate.cardExpiry('08/26').ok; }, true);
    eq("Validate.cardExpiry('07/26').reason", function () { return Validate.cardExpiry('07/26').reason; }, 'past');
    eq("Validate.cardExpiry('01/20').reason", function () { return Validate.cardExpiry('01/20').reason; }, 'past');
    eq("Validate.cardExpiry('13/28').reason", function () { return Validate.cardExpiry('13/28').reason; }, 'format');
    eq("Validate.cardExpiry('').reason", function () { return Validate.cardExpiry('').reason; }, 'format');
    eq("Validate.cardExpiry('12/2028').ok", function () { return Validate.cardExpiry('12/2028').ok; }, true);
    eq("Validate.cardExpiry('10/26', new Date(2026, 10, 3)).reason", function () { return Validate.cardExpiry('10/26', new Date(2026, 10, 3)).reason; }, 'past');
    eq("Validate.cvv('123')", function () { return Validate.cvv('123'); }, true);
    eq("Validate.cvv('1234', '378282246310005') – Amex", function () { return Validate.cvv('1234', '378282246310005'); }, true);
    eq("Validate.cvv('123', '378282246310005') – Amex", function () { return Validate.cvv('123', '378282246310005'); }, false);
    eq("Validate.cvv('1234', '4111111111111111')", function () { return Validate.cvv('1234', '4111111111111111'); }, false);

    group('Validate – מייל (P2-6)');
    eq("Validate.email('a@b.co')", function () { return Validate.email('a@b.co'); }, true);
    eq("Validate.email('  israela@example.co.il  ')", function () { return Validate.email('  israela@example.co.il  '); }, true);
    eq("Validate.email('ישראלה@דוגמה.קום')", function () { return Validate.email('ישראלה@דוגמה.קום'); }, true);
    eq("Validate.email('abc')", function () { return Validate.email('abc'); }, false);
    eq("Validate.email('a@b')", function () { return Validate.email('a@b'); }, false);
    eq("Validate.email('a b@c.co')", function () { return Validate.email('a b@c.co'); }, false);
    eq("Validate.email('<img>@a.co')", function () { return Validate.email('<img>@a.co'); }, false);

    /* ---------- Dates (מחשבון P12) ---------- */
    group('Dates');
    eq("Dates.parse('2026-08-23') → יום ראשון", function () { return Dates.DAYS[Dates.parse('2026-08-23').getDay()]; }, 'ראשון');
    eq("Dates.fastestPickup('2026-08-23') → 2026-08-25 (ג׳)", function () { var d = Dates.fastestPickup('2026-08-23'); return Dates.toISO(d) + '|' + d.getDay(); }, '2026-08-25|2');
    eq("Dates.parse('2026-08-27') → יום חמישי", function () { return Dates.DAYS[Dates.parse('2026-08-27').getDay()]; }, 'חמישי');
    eq("Dates.fastestPickup('2026-08-27') → 2026-08-31 (ב׳)", function () { var d = Dates.fastestPickup('2026-08-27'); return Dates.toISO(d) + '|' + d.getDay(); }, '2026-08-31|1');
    eq("Dates.isBusinessDay(שישי 2026-08-28)", function () { return Dates.isBusinessDay(Dates.parse('2026-08-28')); }, false);

    /* ---------- כללי דילוג בהזמנה (07 §7.1) – פונקציות טהורות מוגדרות כאן מהמפרט ---------- */
    // קדימה מ-1: needs_address ? 2 : 3 · קדימה מ-3: price > 0 ? 4 : 5 · קדימה מ-2 → 3, מ-4 → 5
    function nextStep(method, step) {
      if (step === 1) return method.needs_address ? 2 : 3;
      if (step === 2) return 3;
      if (step === 3) return method.price > 0 ? 4 : 5;
      if (step === 4) return 5;
      return step;
    }
    // אחורה מ-3: needs_address ? 2 : 1 · אחורה מ-4 → 3 · מ-2 → 1
    function prevStep(method, step) {
      if (step === 3) return method.needs_address ? 2 : 1;
      if (step === 4) return 3;
      if (step === 2) return 1;
      return step;
    }
    var methods = {};
    ((window.FD_DATA && FD_DATA.delivery_methods) || []).forEach(function (m) { methods[m.id] = m; });
    var bari = methods.pickup_bari, express = methods.express_home;

    group('Order – כללי דילוג (נתוני השיטות מ-FD_DATA)');
    eq("FD_DATA: pickup_bari = {needs_address:false, price:0}", function () { return !!bari && bari.needs_address === false && bari.price === 0; }, true);
    eq("FD_DATA: express_home = {needs_address:true, price>0}", function () { return !!express && express.needs_address === true && express.price > 0; }, true);
    eq("nextStep(pickup_bari, 1)", function () { return nextStep(bari, 1); }, 3);
    eq("nextStep(pickup_bari, 3)", function () { return nextStep(bari, 3); }, 5);
    eq("nextStep(express_home, 3)", function () { return nextStep(express, 3); }, 4);
    eq("nextStep(express_home, 1)", function () { return nextStep(express, 1); }, 2);
    eq("prevStep(pickup_bari, 3)", function () { return prevStep(bari, 3); }, 1);
    eq("prevStep(express_home, 3)", function () { return prevStep(express, 3); }, 2);

    var s = document.getElementById('summary');
    s.setAttribute('data-fails', String(fail));
    s.setAttribute('data-passes', String(pass));
    s.className = 'badge ' + (fail ? 'badge--danger' : 'badge--success');
    s.textContent = (fail ? 'נכשלו ' + fail + ' מתוך ' + (pass + fail) : 'כל ' + pass + ' הבדיקות עברו');
    document.title = (fail ? 'FAIL ' : 'PASS ') + document.title;
  });
  </script>
</body>
</html>
